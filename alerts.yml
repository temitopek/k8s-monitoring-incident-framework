groups:
- name: availability
  rules:
  - alert: TargetDown
    expr: up == 0
    for: 2m
    labels: {severity: page}
    annotations:
      summary: "{{ $labels.job }} on {{ $labels.instance }} is down"
      runbook: docs/runbooks.md#targetdown
  - alert: HighErrorBudgetBurn
    expr: |
      (sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m]))) > 14.4 * (1 - 0.999)
    for: 5m
    labels: {severity: page}
    annotations: {summary: "Burning the 99.9% SLO error budget 14x too fast"}
- name: saturation
  rules:
  - alert: HighCPU
    expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
    for: 15m
    labels: {severity: ticket}
    annotations: {summary: "CPU above 85% on {{ $labels.instance }} for 15m"}
  - alert: DiskFillingUp
    expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
    for: 30m
    labels: {severity: ticket}
    annotations: {summary: "{{ $labels.instance }} {{ $labels.mountpoint }} will fill within 24h"}
- name: kubernetes
  rules:
  - alert: PodCrashLooping
    expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
    for: 5m
    labels: {severity: page}
    annotations: {summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash looping"}
