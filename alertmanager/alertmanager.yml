route:
  receiver: ticket-queue
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: oncall
      repeat_interval: 1h
inhibit_rules:
  - source_matchers: [alertname="TargetDown"]
    target_matchers: [severity="ticket"]
    equal: [instance]
receivers:
  # Demo receiver (receiver/receiver.py) prints alerts to its container logs.
  # For real use, replace these webhooks with Slack, PagerDuty, Opsgenie or email.
  - name: oncall
    webhook_configs: [{url: "http://alert-receiver:5001/oncall"}]
  - name: ticket-queue
    webhook_configs: [{url: "http://alert-receiver:5001/tickets"}]
